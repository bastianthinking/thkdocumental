<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Documental - Thinking SpA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Librería servida desde la propia app: Edge bloquea el almacenamiento a scripts de cdn.jsdelivr.net y no guardaba la sesión -->
    <script src="vendor/supabase-js-2.45.4.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red: #F32121;
            --blue: #293654;
            --navy: #161F36;
            --white: #FFFFFF;
            --bg: #F5F6FA;
            --text: #1D2433;
            --muted: #6B7287;
            --border: #E6E8F0;
            --ok: #1E7F4F;     --ok-bg: #E6F4EC;
            --warn: #9A5B00;   --warn-bg: #FFF3DC;
            --bad: #B42318;    --bad-bg: #FDECEA;
            --info: #293654;   --info-bg: #E9ECF5;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(20,26,50,.06), 0 4px 16px rgba(20,26,50,.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        button { font-family: inherit; cursor: pointer; }
        input, select { font-family: inherit; font-size: 14px; }

        /* ─── LOGIN ─── */
        .login-page { display: none; justify-content: center; align-items: center; min-height: 100vh; background: var(--navy); padding: 16px; }
        .login-box { background: var(--white); padding: 40px 32px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
        .login-box h1 { font-size: 22px; color: var(--blue); margin-bottom: 4px; }
        .login-box p.sub { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
        .btn { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
        .btn-primary { background: var(--red); color: var(--white); width: 100%; }
        .btn-primary:hover { background: #D91E1E; }
        .btn-primary:disabled { opacity: .6; cursor: default; }
        .btn-ghost { background: var(--white); color: var(--blue); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; }
        .mensaje { font-size: 13px; min-height: 18px; margin-top: 12px; line-height: 1.5; }
        .mensaje.error { color: var(--bad); }
        .mensaje.ok { color: var(--ok); }

        /* ─── LAYOUT ─── */
        .app { display: none; min-height: 100vh; }
        .app.active { display: block; }
        header { background: var(--navy); color: var(--white); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        header .brand { display: flex; flex-direction: column; }
        header .brand strong { font-size: 16px; }
        header .brand span { font-size: 12px; opacity: .7; }
        header .user { display: flex; align-items: center; gap: 10px; font-size: 13px; }

        main { max-width: 1280px; margin: 0 auto; padding: 24px; }

        /* ─── KPIs ─── */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi { background: var(--white); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); cursor: pointer; border: 2px solid transparent; }
        .kpi:hover { border-color: var(--border); }
        .kpi .valor { font-size: 26px; font-weight: 800; color: var(--blue); }
        .kpi .etiqueta { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .kpi.alerta .valor { color: var(--bad); }

        /* ─── FILTROS ─── */
        .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
        .filtros input { flex: 1 1 240px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
        .filtros select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--white); }
        .meta-sync { font-size: 12px; color: var(--muted); margin-left: auto; }

        /* ─── TABLA ─── */
        .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tbody tr.fila { cursor: pointer; }
        tbody tr.fila:hover { background: #FAFBFD; }
        td.codigo { font-weight: 700; color: var(--blue); white-space: nowrap; }
        td.nombre { font-weight: 500; }
        td.version { font-weight: 700; white-space: nowrap; }
        td.fecha { white-space: nowrap; color: var(--muted); }
        .vacio { text-align: center; padding: 40px; color: var(--muted); }

        .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
        .pill.ok { color: var(--ok); background: var(--ok-bg); }
        .pill.warn { color: var(--warn); background: var(--warn-bg); }
        .pill.bad { color: var(--bad); background: var(--bad-bg); }
        .pill.info { color: var(--info); background: var(--info-bg); }

        /* ─── DETALLE ─── */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(22,31,54,.45); z-index: 50; justify-content: flex-end; }
        .overlay.active { display: flex; }
        .panel { background: var(--white); width: 100%; max-width: 620px; height: 100%; overflow-y: auto; padding: 28px; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
        .panel .cerrar { float: right; background: none; border: none; font-size: 22px; color: var(--muted); }
        .panel .tipo { font-size: 12px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .06em; }
        .panel h2 { font-size: 20px; color: var(--blue); margin: 4px 0 8px; }
        .panel .desc { color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
        .panel .datos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        .panel .dato { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
        .panel .dato > span { display: block; font-size: 11px; color: var(--muted); }
        .panel .dato strong { font-size: 14px; }
        .panel .archivo { font-size: 12px; color: var(--muted); word-break: break-all; margin-bottom: 22px; }
        .panel h3 { font-size: 14px; color: var(--blue); margin-bottom: 12px; }

        .timeline { list-style: none; border-left: 2px solid var(--border); margin-left: 8px; }
        .timeline li { position: relative; padding: 0 0 18px 20px; }
        .timeline li::before { content: ''; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--white); border: 2px solid var(--blue); }
        .timeline li:first-child::before { background: var(--red); border-color: var(--red); }
        .timeline .v { font-weight: 800; color: var(--blue); }
        .timeline .f { font-size: 12px; color: var(--muted); margin-left: 8px; }
        .timeline p { margin-top: 4px; line-height: 1.5; }

        @media (max-width: 760px) {
            main { padding: 16px; }
            header { padding-left: 16px; padding-right: 16px; }
            .col-opcional { display: none; }
            .panel { padding: 20px 16px; }
            .panel .datos { grid-template-columns: 1fr; }
            .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .filtros input, .filtros select { flex: 1 1 100%; min-width: 0; }
            .meta-sync { margin-left: 0; }
            td, th { padding: 10px; }
        }
    </style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div class="login-page" id="loginPage">
    <div class="login-box">
        <h1>Control Documental</h1>
        <p class="sub">Manuales y QRG del Training Center. Ingresa con tu correo @thinking.cl y te enviaremos un link de acceso.</p>
        <form onsubmit="enviarLink(event)">
            <div class="field">
                <label for="email">Correo</label>
                <input type="email" id="email" required autocomplete="email" placeholder="nombre@thinking.cl">
            </div>
            <button class="btn btn-primary" id="btnLink" type="submit">Enviarme el link de acceso</button>
        </form>
        <div class="mensaje" id="mensajeLogin"></div>
    </div>
</div>

<!-- ─── APP ─── -->
<div class="app" id="app">
    <header>
        <div class="brand">
            <strong>Control Documental</strong>
            <span>Manuales y QRG del Training Center</span>
        </div>
        <div class="user">
            <span id="userEmail"></span>
            <button class="btn btn-ghost" onclick="salir()">Salir</button>
        </div>
    </header>

    <main>
        <div class="kpis" id="kpis"></div>

        <div class="filtros">
            <input type="search" id="fBuscar" placeholder="Buscar por código, nombre o cambio…" oninput="render()">
            <select id="fTipo" onchange="render()">
                <option value="">Tipo: todos</option>
                <option>Manual</option>
                <option>QRG</option>
            </select>
            <select id="fMarca" onchange="render()"><option value="">Marca: todas</option></select>
            <select id="fEstado" onchange="render()">
                <option value="">Estado: todos</option>
                <option>Al día</option>
                <option>Cambios pendientes</option>
                <option>Por revisar</option>
                <option value="__revision">Versión nueva en revisión</option>
            </select>
            <span class="meta-sync" id="metaSync"></span>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th class="col-opcional">Marca</th>
                        <th>Versión</th>
                        <th class="col-opcional">Fecha</th>
                        <th>Publicación</th>
                        <th>Bóveda</th>
                    </tr>
                </thead>
                <tbody id="tabla"><tr><td colspan="8" class="vacio">Cargando…</td></tr></tbody>
            </table>
        </div>
    </main>
</div>

<!-- ─── DETALLE DE UN MATERIAL ─── -->
<div class="overlay" id="detalle" onclick="if (event.target === this) cerrarDetalle()">
    <div class="panel" id="panel"></div>
</div>

<script>
    // ─── CONFIG ──────────────────────────────────────────────────────────
    // Clave pública (anon). Los datos los protege Supabase: solo se entregan
    // a sesiones con correo @thinking.cl verificado (política es_thinking()).
    const SUPABASE_URL = 'https://kmrvvbbyekzuzimzahvd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ZphXuMK9lAQhw9q68k409w_DVrhuTJg';
    const DOMINIO = '@thinking.cl';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { storage: window.localStorage, persistSession: true, autoRefreshToken: true }
    });

    let materiales = [];
    let cargado = false;

    // ─── SESIÓN ──────────────────────────────────────────────────────────
    function esThinking(email) { return (email || '').toLowerCase().endsWith(DOMINIO); }

    async function init() {
        // El callback no debe esperar otras llamadas a Supabase: mientras corre, la librería
        // tiene tomada la sesión y una consulta adentro queda bloqueada (al recargar la página
        // quedaba en «Cargando…»). Por eso las llamadas se difieren con setTimeout.
        sb.auth.onAuthStateChange((_event, session) => {
            const email = session?.user?.email;
            if (!email) { cargado = false; mostrarLogin(); return; }
            if (!esThinking(email)) {
                setTimeout(async () => {
                    await sb.auth.signOut();
                    mostrarLogin(`Solo pueden ingresar correos ${DOMINIO}.`, 'error');
                }, 0);
                return;
            }
            mostrarApp(email);
            if (!cargado) { cargado = true; setTimeout(cargarMateriales, 0); }
        });
    }

    async function enviarLink(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim().toLowerCase();
        if (!esThinking(email)) { mensaje(`Usa tu correo ${DOMINIO}.`, 'error'); return; }
        const btn = document.getElementById('btnLink');
        btn.disabled = true; btn.textContent = 'Enviando…';
        const { error } = await sb.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: location.origin + location.pathname }
        });
        btn.disabled = false; btn.textContent = 'Enviarme el link de acceso';
        if (error) mensaje('No se pudo enviar el link: ' + error.message, 'error');
        else mensaje(`Listo. Revisa tu correo (${email}) y abre el link desde este mismo navegador.`, 'ok');
    }

    async function salir() { await sb.auth.signOut(); }

    function mensaje(texto, tipo) {
        const div = document.getElementById('mensajeLogin');
        div.textContent = texto || '';
        div.className = 'mensaje ' + (tipo || '');
    }

    function mostrarLogin(texto, tipo) {
        document.getElementById('app').classList.remove('active');
        document.getElementById('loginPage').style.display = 'flex';
        mensaje(texto, tipo);
    }

    function mostrarApp(email) {
        document.getElementById('userEmail').textContent = email;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('app').classList.add('active');
    }

    // ─── MATERIALES ──────────────────────────────────────────────────────
    async function cargarMateriales() {
        // Si Supabase no responde, se avisa en vez de quedar en «Cargando…»
        const espera = new Promise(r => setTimeout(() => r({ error: { message: 'Supabase no respondió a tiempo. Recarga la página.' } }), 20000));
        const { data, error } = await Promise.race([sb.from('materiales').select('*'), espera]);
        if (error) {
            cargado = false;
            document.getElementById('tabla').innerHTML =
                `<tr><td colspan="8" class="vacio">No se pudieron cargar los materiales: ${esc(error.message)}</td></tr>`;
            return;
        }
        materiales = (data || []).sort((a, b) =>
            (a.tipo === b.tipo ? 0 : a.tipo === 'Manual' ? -1 : 1) ||
            (a.codigo || a.nombre).localeCompare(b.codigo || b.nombre, 'es'));

        const marcas = [...new Set(materiales.map(m => m.marca).filter(Boolean))].sort();
        document.getElementById('fMarca').innerHTML = '<option value="">Marca: todas</option>' +
            marcas.map(m => `<option>${esc(m)}</option>`).join('');

        const sync = materiales.map(m => m.sincronizado).filter(Boolean).sort().pop();
        document.getElementById('metaSync').textContent = sync ? `Datos al ${fecha(sync)}` : '';
        render();
    }

    function filtrados() {
        const q = document.getElementById('fBuscar').value.trim().toLowerCase();
        const tipo = document.getElementById('fTipo').value;
        const marca = document.getElementById('fMarca').value;
        const estado = document.getElementById('fEstado').value;
        return materiales.filter(m => {
            if (tipo && m.tipo !== tipo) return false;
            if (marca && m.marca !== marca) return false;
            if (estado === '__revision' && !m.en_revision) return false;
            if (estado && estado !== '__revision' && m.al_dia !== estado) return false;
            if (!q) return true;
            const texto = [m.codigo, m.nombre, m.descripcion, ...(m.versiones || []).map(v => v.cambios)].join(' ').toLowerCase();
            return texto.includes(q);
        });
    }

    function render() {
        renderKpis();
        const lista = filtrados();
        const tbody = document.getElementById('tabla');
        if (!lista.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="vacio">Ningún material coincide con los filtros.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(m => `
            <tr class="fila" onclick="abrirDetalle('${esc(m.id)}')">
                <td class="codigo">${esc(m.codigo || 'QRG')}</td>
                <td class="nombre">${esc(m.nombre)}</td>
                <td>${esc(m.tipo)}</td>
                <td class="col-opcional">${esc(m.marca)}</td>
                <td class="version">${esc(m.version)}</td>
                <td class="fecha col-opcional">${fecha(m.fecha_version)}</td>
                <td>${pillPublicacion(m)}</td>
                <td>${pillAlDia(m.al_dia)}</td>
            </tr>`).join('');
    }

    function renderKpis() {
        const n = f => materiales.filter(f).length;
        const kpis = [
            { valor: materiales.length, etiqueta: 'Materiales', accion: () => limpiarFiltros() },
            { valor: n(m => m.tipo === 'Manual'), etiqueta: 'Manuales', accion: () => filtrar('fTipo', 'Manual') },
            { valor: n(m => m.tipo === 'QRG'), etiqueta: 'QRG', accion: () => filtrar('fTipo', 'QRG') },
            { valor: n(m => m.al_dia === 'Cambios pendientes'), etiqueta: 'Con cambios pendientes', alerta: true, accion: () => filtrar('fEstado', 'Cambios pendientes') },
            { valor: n(m => m.en_revision), etiqueta: 'Versión nueva en revisión', accion: () => filtrar('fEstado', '__revision') },
        ];
        const cont = document.getElementById('kpis');
        cont.innerHTML = '';
        kpis.forEach(k => {
            const div = document.createElement('div');
            div.className = 'kpi' + (k.alerta && k.valor ? ' alerta' : '');
            div.innerHTML = `<div class="valor">${k.valor}</div><div class="etiqueta">${k.etiqueta}</div>`;
            div.onclick = k.accion;
            cont.appendChild(div);
        });
    }

    function filtrar(id, valor) { limpiarFiltros(false); document.getElementById(id).value = valor; render(); }
    function limpiarFiltros(volverARender = true) {
        ['fBuscar', 'fTipo', 'fMarca', 'fEstado'].forEach(id => document.getElementById(id).value = '');
        if (volverARender) render();
    }

    function pillPublicacion(m) {
        const base = m.publicacion === 'Publicado' ? '<span class="pill ok">Publicado</span>' : `<span class="pill warn">${esc(m.publicacion || 'Sin publicar')}</span>`;
        return m.en_revision ? base + ' <span class="pill info">Nueva en revisión</span>' : base;
    }

    function pillAlDia(valor) {
        const clase = { 'Al día': 'ok', 'Cambios pendientes': 'bad', 'Por revisar': 'warn' }[valor] || 'info';
        return `<span class="pill ${clase}">${esc(valor || '—')}</span>`;
    }

    function abrirDetalle(id) {
        const m = materiales.find(x => x.id === id);
        if (!m) return;
        const versiones = m.versiones || [];
        document.getElementById('panel').innerHTML = `
            <button class="cerrar" onclick="cerrarDetalle()" aria-label="Cerrar">×</button>
            <div class="tipo">${esc(m.tipo)}${m.codigo ? ' · ' + esc(m.codigo) : ''}</div>
            <h2>${esc(m.nombre)}</h2>
            ${m.descripcion ? `<p class="desc">${esc(m.descripcion)}</p>` : ''}
            <div class="datos">
                <div class="dato"><span>Versión vigente</span><strong>${esc(m.version)}</strong></div>
                <div class="dato"><span>Fecha</span><strong>${fecha(m.fecha_version)}</strong></div>
                <div class="dato"><span>Publicación</span><strong>${pillPublicacion(m)}</strong></div>
                <div class="dato"><span>Bóveda</span><strong>${pillAlDia(m.al_dia)}</strong></div>
                <div class="dato"><span>Marca</span><strong>${esc(m.marca || '—')}</strong></div>
                <div class="dato"><span>Versiones registradas</span><strong>${versiones.length}</strong></div>
            </div>
            ${m.archivo ? `<div class="archivo">SharePoint · Version Editables / ${esc(m.archivo)}</div>` : ''}
            <h3>Historial de versiones</h3>
            ${versiones.length ? `<ul class="timeline">${versiones.map(v => `
                <li>
                    <span class="v">v${esc(v.version)}</span><span class="f">${fecha(v.fecha)}</span>
                    <p>${esc(v.cambios)}</p>
                </li>`).join('')}</ul>` : '<p class="desc">Sin historial registrado.</p>'}
        `;
        document.getElementById('detalle').classList.add('active');
    }

    function cerrarDetalle() { document.getElementById('detalle').classList.remove('active'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarDetalle(); });

    // ─── UTILIDADES ──────────────────────────────────────────────────────
    function esc(t) {
        if (t == null) return '';
        const d = document.createElement('div');
        d.textContent = String(t);
        return d.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    function fecha(iso) {
        if (!iso) return '—';
        const [a, m, d] = String(iso).slice(0, 10).split('-');
        return d && m && a ? `${d}-${m}-${a}` : esc(iso);
    }

    init();
</script>
</body>
</html>
